# Loads default set of integrations. Do not remove.
default_config:
# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes
# Text to speech
tts:
  - platform: google_translate

utility_meter:
  energieverbruik_warmtepomp:
    source: sensor.unit_power_consumption
    name: Energieverbruik warmtepomp
    cycle: daily
  wp_meter_verbruik_dag:
    source: sensor.wp_meter_energie
    name: Warmtepomp verbruik dag
    cycle: daily
  wp_meter_verbruik_week:
    source: sensor.wp_meter_energie
    name: Warmtepomp verbruik week
    cycle: weekly
  wp_meter_verbruik_maand:
    source: sensor.wp_meter_energie
    name: Warmtepomp verbruik maand
    cycle: monthly
  wp_meter_verbruik_jaar:
    source: sensor.wp_meter_energie
    name: Warmtepomp verbruik jaar
    cycle: yearly
  warmtepomp_thermisch_dag:
    source: sensor.thermische_energie_warmtepomp
    name: Warmtepomp thermisch dag
    cycle: daily
  warmtepomp_thermisch_maand:
    source: sensor.thermische_energie_warmtepomp
    name: Warmtepomp thermisch maand
    cycle: monthly

homeassistant:
   customize: !include customize.yaml

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
sensor: !include_dir_merge_list sensors/

# Voor Heat Next WP
template:

  # Externe stroommeter (PC311-Z-TY, via MQTT) - stabiele namen voor het dashboard.
  # PAS DE ENTITY-ID's BIJ 'states(...)' AAN naar jouw meter (vermogen in W).
  - sensor:
      - name: "WP meter vermogen"
        unique_id: wp_meter_vermogen
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        availability: "{{ states('sensor.stroommeter_heative_warmtepomp_vermogen') | is_number }}"
        state: "{{ states('sensor.stroommeter_heative_warmtepomp_vermogen') | float(0) }}"
      - name: "WP meter stroom"
        unique_id: wp_meter_stroom
        unit_of_measurement: "A"
        device_class: current
        state_class: measurement
        availability: "{{ states('sensor.stroommeter_heative_warmtepomp_stroom') | is_number }}"
        state: "{{ states('sensor.stroommeter_heative_warmtepomp_stroom') | float(0) }}"
      - name: "WP meter spanning"
        unique_id: wp_meter_spanning
        unit_of_measurement: "V"
        device_class: voltage
        state_class: measurement
        availability: "{{ states('sensor.stroommeter_heative_warmtepomp_spanning') | is_number }}"
        state: "{{ states('sensor.stroommeter_heative_warmtepomp_spanning') | float(0) }}"
      - name: "WP meter frequentie"
        unique_id: wp_meter_frequentie
        unit_of_measurement: "Hz"
        device_class: frequency
        state_class: measurement
        availability: "{{ states('sensor.stroommeter_heative_warmtepomp_frequentie') | is_number }}"
        state: "{{ states('sensor.stroommeter_heative_warmtepomp_frequentie') | float(0) }}"
      - name: "WP meter energie"
        unique_id: wp_meter_energie
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        availability: "{{ states('sensor.stroommeter_heative_warmtepomp_energie') | is_number }}"
        state: "{{ states('sensor.stroommeter_heative_warmtepomp_energie') | float(0) }}"

      # COP op basis van gemeten vermogen: thermisch (kW) / elektrisch (W)
      - name: "Warmtepomp COP (gemeten)"
        unique_id: warmtepomp_cop_gemeten
        icon: mdi:lightning-bolt-circle
        state_class: measurement
        availability: >
          {{ states('sensor.thermal_power') | is_number
             and states('sensor.wp_meter_vermogen') | is_number }}
        state: >
          {% set th = states('sensor.thermal_power') | float(0) * 1000 %}
          {% set el = states('sensor.wp_meter_vermogen') | float(0) %}
          {% if el < 200 or th <= 0 %}
            {{ none }}
          {% else %}
            {% set cop = th / el %}
            {{ cop | round(2) if cop <= 10 else none }}
          {% endif %}

      # COP over de dag: thermische opbrengst / gemeten verbruik
      - name: "Warmtepomp COP vandaag"
        unique_id: warmtepomp_cop_vandaag
        icon: mdi:lightning-bolt-circle
        state: >
          {% set v = states('sensor.wp_meter_verbruik_dag') | float(0) %}
          {% set t = states('sensor.warmtepomp_thermisch_dag') | float(0) %}
          {{ (t / v) | round(2) if v >= 2 and t > 0 else none }}
  - sensor:
      - name: "Warmtepomp klimaat setpoint"
        unique_id: warmtepomp_klimaat_setpoint
        unit_of_measurement: "°C"
        device_class: temperature
        icon: mdi:thermostat
        availability: >
          {{ states('select.mode') in ['Cooling', 'Heating', 'Floor Heating',
             'Hot Water + Cooling', 'Hot Water + Heating', 'Hot Water + Floor Heating'] }}
        state: >
          {% set mode = states('select.mode') %}
          {% if mode in ['Cooling', 'Hot Water + Cooling'] %}
            {{ states('number.temp_set_cooling') }}
          {% elif mode in ['Heating', 'Hot Water + Heating'] %}
            {{ states('number.temp_set_heating') }}
          {% elif mode in ['Floor Heating', 'Hot Water + Floor Heating'] %}
            {{ states('number.temp_set_floor_heating') }}
          {% endif %}
 
      - name: "Warmtepomp warm water setpoint"
        unique_id: warmtepomp_warmwater_setpoint
        unit_of_measurement: "°C"
        device_class: temperature
        icon: mdi:water-thermometer
        availability: >
          {{ 'Hot Water' in states('select.mode') }}
        state: >
          {{ states('number.temp_set_hot_water') }}


  - sensor:
      - name: >
          {% set curve = states('select.heating_setting_curve') %}
          Delta T (T7-T6) - {{ curve }}
        unique_id: delta_t_t7_t6
        unit_of_measurement: "°C"
        device_class: temperature
        state: >
          {% set t6 = states('sensor.water_inlet_temp_t6') | float(none) %}
          {% set t7 = states('sensor.water_outlet_temp_t7') | float(none) %}
          {% if t6 is none or t7 is none %}
            {{ none }}
          {% else %}
            {{ (t7 - t6) | round(1) }}
          {% endif %}
  - binary_sensor:
      - name: "Warmtepomp Modus Heating actief"
        unique_id: wp_modus_heating_actief
        state: "{{ 'Heating' in states('select.mode') }}"

      - name: "Warmtepomp Modus Cooling actief"
        unique_id: wp_modus_cooling_actief
        state: "{{ 'Cooling' in states('select.mode') }}"

      - name: "Warmtepomp Modus DHW actief"
        unique_id: wp_modus_dhw_actief
        state: "{{ 'Hot Water' in states('select.mode') }}"

  - sensor:
      - name: "Running Mode (weergave)"
        unique_id: running_mode_display
        state: "{{ states('select.running_mode') }}"

      - name: "Heating Setting Curve (weergave)"
        unique_id: heating_setting_curve_display
        state: "{{ states('select.heating_setting_curve') }}"

      - name: "Status (weergave)"
        unique_id: status_display
        icon: mdi:thermostat
        state: >
          {% set mode = states('climate.next_hp') %}
          {% set vertaling = {
            'heat': 'Verwarmen', 'cool': 'Koelen', 'off': 'Uit',
            'auto': 'Automatisch', 'heat_cool': 'Verwarmen/Koelen',
            'dry': 'Ontvochtigen', 'fan_only': 'Ventileren'
          } %}
          {{ vertaling.get(mode, mode) }}


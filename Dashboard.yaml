title: Warmtepomp
views:
  - title: Overzicht
    path: overzicht
    icon: mdi:home-thermometer
    cards:
      - type: entities
        title: Status
        entities:
          - entity: switch.heatpump_on_off
          - entity: climate.next_hp
          - entity: select.mode
          - entity: select.running_mode
          - entity: binary_sensor.running_status_fault_alarm
            name: Storing
          - entity: sensor.program_version
          - entity: sensor.protocol_version
          - entity: sensor.refrigerant_type
      - square: false
        type: grid
        title: 'Temperaturen '
        columns: 2
        cards:
          - type: gauge
            entity: sensor.warmtepomp_klimaat_setpoint
            name: Temperatuur setpoint
            needle: true
            min: 0
            max: 75
            severity:
              green: 20
              yellow: 35
              red: 50
          - type: gauge
            entity: sensor.water_outlet_temp_t7
            name: Water uit
            min: 0
            max: 70
            needle: true
            severity:
              green: 0
              yellow: 40
              red: 60
          - type: gauge
            entity: sensor.water_inlet_temp_t6
            name: Water in
            min: 0
            needle: true
            severity:
              green: 0
              yellow: 40
              red: 60
            max: 70
          - type: gauge
            entity: sensor.ambient_temp_t1
            name: Buitentemp.
            min: -20
            max: 40
            needle: true
            severity:
              green: 0
              yellow: 25
              red: 30
      - type: glance
        title: Kerncijfers
        columns: 3
        entities:
          - entity: sensor.cop
            name: COP
          - entity: sensor.thermal_power
            name: Thermisch vermogen
          - entity: sensor.unit_power_consumption
            name: Verbruik
      - type: entities
        title: Energie vandaag
        entities:
          - entity: sensor.energieverbruik_warmtepomp_2
            name: Verbruik (elektrisch)
          - entity: sensor.thermische_energie_warmtepomp
            name: Opbrengst (thermisch)
      - type: statistics-graph
        entities:
          - sensor.cop
        title: COP trend (7 dagen)
        days_to_show: 7
        period: day
        chart_type: line
        stat_types:
          - mean
          - min
          - max
      - type: history-graph
        title: Vermogen laatste 24u
        hours_to_show: 24
        entities:
          - sensor.unit_power_consumption
          - sensor.thermal_power
      - type: statistics-graph
        entities:
          - entity: sensor.unit_power_consumption
          - sensor.thermische_energie_warmtepomp
        title: Energieverbruik & -opbrengst (7 dagen)
        days_to_show: 7
        period: day
        chart_type: bar
        stat_types:
          - sum
        unit: kWh
        expand_legend: true
    type: masonry
    show_icon_and_title: true
  - title: Bediening
    path: bediening
    icon: mdi:tune
    cards:
      - type: entities
        title: Aan/uit & modus
        entities:
          - entity: switch.heatpump_on_off
          - entity: select.running_mode
          - entity: select.mode
      - type: entities
        title: Temperatuur instellingen
        entities:
          - entity: number.temp_set_heating
          - entity: number.temp_set_floor_heating
          - entity: number.temp_set_cooling
          - entity: number.temp_set_hot_water
          - entity: number.silent_mode_compressor_max_frequency
          - entity: number.silent_mode_fan_max_frequency
          - entity: number.electric_heater_allow_start_temp
      - type: entities
        title: Stooklijnen (curves)
        entities:
          - entity: select.heating_setting_curve
          - entity: select.underfloor_heating_setting_curve
          - entity: select.cooling_setting_curve
          - entity: select.hot_water_setting_curve
      - type: custom:scheduler-card
        default_editor: scheme
        show_header_toggle: true
      - type: tile
        entity: number.min_flow_protection
    type: masonry
    show_icon_and_title: true
  - title: Temperaturen
    path: temperaturen
    icon: mdi:thermometer
    cards:
      - type: entities
        title: Water & omgeving
        entities:
          - entity: sensor.ambient_temp_t1
          - entity: sensor.outer_coil_temp_t2
          - entity: sensor.inner_coil_temp_t3
          - entity: sensor.water_inlet_temp_t6
          - entity: sensor.water_outlet_temp_t7
          - entity: sensor.dhw_tank_temp
          - entity: sensor.dhw_return_water_temp
          - entity: sensor.plate_hx_exhaust_temp
      - type: entities
        title: Koelcircuit / compressor
        entities:
          - sensor.suction_temp_t4
          - sensor.exhaust_temp_t5
          - sensor.compressor_ipm_temp
          - sensor.high_pressure_saturation_temp
          - sensor.low_pressure_saturation_temp
          - sensor.economizer_inlet_temp_t8
          - sensor.economizer_outlet_temp_t9
      - type: history-graph
        title: Temperatuurverloop
        hours_to_show: 24
        entities:
          - sensor.ambient_temp_t1
          - sensor.water_inlet_temp_t6
          - sensor.water_outlet_temp_t7
          - sensor.dhw_tank_temp
      - type: markdown
        content: |
          {% set mode = states('select.mode') %} {% if mode == 'Cooling' %}
            **Ingestelde temp. (Koelen):** {{ states('number.temp_set_cooling') }} °C
          {% elif mode == 'Heating' %}
            **Ingestelde temp. (Verwarmen):** {{ states('number.temp_set_heating') }} °C
          {% elif mode == 'Hot Water' %}
            **Ingestelde temp. (Warm water):** {{ states('number.temp_set_hot_water') }} °C
          {% elif mode == 'Floor Heating' %}
            **Ingestelde temp. (Vloerverwarming):** {{ states('number.temp_set_floor_heating') }} °C
          {% elif mode == 'Hot Water + Cooling' %}
            **Ingestelde temp. (Warm water):** {{ states('number.temp_set_hot_water') }} °C
            **Ingestelde temp. (Koelen):** {{ states('number.temp_set_cooling') }} °C
          {% elif mode == 'Hot Water + Heating' %}
            **Ingestelde temp. (Warm water):** {{ states('number.temp_set_hot_water') }} °C
            **Ingestelde temp. (Verwarmen):** {{ states('number.temp_set_heating') }} °C
          {% elif mode == 'Hot Water + Floor Heating' %}
            **Ingestelde temp. (Warm water):** {{ states('number.temp_set_hot_water') }} °C
            **Ingestelde temp. (Vloerverwarming):** {{ states('number.temp_set_floor_heating') }} °C
          {% else %}
            **Ingestelde temp.:** onbekende modus ({{ mode }})
          {% endif %}
        title: Ingestelde temperatuur
    type: masonry
    show_icon_and_title: true
  - title: Diagnose
    path: elektrisch
    icon: mdi:folder-wrench-outline
    cards:
      - type: entities
        title: Netaansluiting
        entities:
          - entity: sensor.ac_input_voltage
          - entity: sensor.ac_input_current
          - entity: sensor.unit_input_voltage
          - entity: sensor.unit_input_current
          - entity: sensor.unit_input_power
      - type: entities
        title: Compressor
        entities:
          - sensor.compressor_phase_current
          - entity: sensor.next_heatpump_192_168_2_94_compressor_running_frequency
            name: Compressor draaifrequentie
          - sensor.compressor_target_frequency
      - type: entities
        title: Vermogen & rendement
        entities:
          - sensor.thermal_power
          - sensor.calculated_power
          - sensor.unit_power_consumption
          - sensor.cop
      - type: history-graph
        title: Stroom & vermogen
        hours_to_show: 48
        entities:
          - sensor.unit_input_current
          - sensor.unit_power_consumption
      - type: entities
        title: Mechaniek
        entities:
          - sensor.fan_running_speed
          - sensor.eev_open_step
          - sensor.evi_valve_open_step
          - sensor.water_pump_speed_pwm
          - sensor.water_flow
      - type: entities
        title: Overig
        entities:
          - entity: sensor.refrigerant_type
          - entity: binary_sensor.running_status_fault_alarm
          - entity: sensor.unit_power_consumption
      - type: statistics-graph
        entities:
          - sensor.water_flow
        title: Water flow
        days_to_show: 1
        period: hour
        chart_type: line
        stat_types:
          - mean
          - min
          - max
        hide_legend: false
        expand_legend: false
        logarithmic_scale: false
    type: masonry
    show_icon_and_title: true
  - title: Storingen

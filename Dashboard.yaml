  - type: sections
    max_columns: 4
    title: Stooklijnen
    path: stooklijnen
    sections:
      - type: grid
        column_span: 4
        cards:
          - type: entities
            title: Gevolgde stooklijn
            entities:
              - entity: select.heating_setting_curve
                name: Gekozen curve
              - entity: sensor.unit_temperature_control_mode
                name: Regelt op (P116)
              - entity: sensor.ambient_temp_t1
                name: Buitentemp. (T1)
              - entity: sensor.heating_curve_target
                name: Doeltemp. volgens curve
              - entity: sensor.actual_controlled_water_temp
                name: Actuele geregelde temp.
              - entity: sensor.water_inlet_temp_t6
                name: Inlaattemp. (T6)
              - entity: sensor.water_outlet_temp_t7
                name: Uitlaattemp. (T7)
          - type: conditional
            conditions:
              - entity: select.heating_setting_curve
                state_not: 'Off'
            card:
              type: custom:apexcharts-card
              header:
                title: Stooklijn (huidige selectie)
                show: true
              chart_type: line
              apex_config:
                xaxis:
                  type: numeric
                  sorted: true
                  tickAmount: 8
                  title:
                    text: Buitentemperatuur (°C)
                  labels:
                    rotate: -90
                    style:
                      fontSize: 10px
                yaxis:
                  tickAmount: 8
                  title:
                    text: Doel water-uitlaattemp. (°C)
                tooltip:
                  x:
                    formatter: function(value) { return value + ' °C'; }
                stroke:
                  curve: stepline
                  width: 2
              series:
                - entity: sensor.heating_curve_target
                  name: Stooklijn
                  type: line
                  color: '#0AF'
                  data_generator: >
                    const points = entity.attributes.curve_points || [];

                    if (points.length === 0) return [];

                    const result = [];

                    points.forEach((p) => {
                      // Eén punt per bucket, op de ondergrens van dat bereik. Bij een
                      // open ondergrens ("<X", laagste bucket) benaderen we die met
                      // 8 graden extra voor de weergave. stroke.curve: stepline
                      // tekent zelf de horizontale-dan-verticale trapvorm tussen
                      // opeenvolgende punten — dus GEEN dubbele grenspunten hier,
                      // anders ontstaan er dubbele/blokkerige sprongen.
                      const xStart = p.ambient_from !== null ? p.ambient_from : (p.ambient_to !== null ? p.ambient_to - 8 : -25);
                      result.push({x: `${xStart}`, y: p.target_temp});
                    });

                    // Sluit de trap af aan de rechterkant (hoogste bucket, open

                    // bovengrens) met een laatste punt op dezelfde hoogte.

                    const highest = Math.max(...points.map(p => p.ambient_from
                    !== null ? p.ambient_from : -999));

                    const highestBucket = points.find(p => p.ambient_from ===
                    highest);

                    if (highestBucket) {
                      const xEnd = highestBucket.ambient_from + 8;
                      result.push({x: `${xEnd}`, y: highestBucket.target_temp});
                    }

                    // Sorteer expliciet op X (laag naar hoog), zodat negatieve

                    // temperaturen altijd links op de as beginnen, ongeacht de

                    // volgorde waarin de curve-buckets in de tabel staan.

                    result.sort((a, b) => parseFloat(a.x) - parseFloat(b.x));

                    return result;
                - entity: sensor.actual_controlled_water_temp
                  name: Huidig punt
                  type: line
                  color: '#F00'
                  data_generator: |
                    const ambient = entity.attributes.ambient_temp;
                    const target = parseFloat(entity.state);
                    if (ambient === null || isNaN(target)) return [];
                    return [{x: `${ambient}`, y: target}];
          - type: conditional
            conditions:
              - entity: select.heating_setting_curve
                state: 'Off'
            card:
              type: markdown
              content: >
                ### Stooklijn (huidige selectie)

                Geen stooklijn actief — de curve-selectie staat op **Off**. Zet
                `select.heating_setting_curve` op een curve (H1-H8/L1-L8) om de
                bijbehorende grafiek hier te zien.
